<svg xmlns="http://www.w3.org/2000/svg"
     width="600" height="325" viewBox="0 0 480 260"
     data-sema-version="0.1.0"
     data-sema-project="one-room-two-views"
     data-sema-view="room-card"
     data-sema-view-kind="system-overview"
     data-sema-coordinate-mode="diagrammatic"
     data-sema-profiles="building@0.1.0"
     data-sema-scope="room-study">
  <title>Study: diagrammatic card</title>
  <desc>The same room-study entity shown as a card. Card coordinates and dimensions have no physical meaning.</desc>
  <rect id="repr-room-study-card"
        data-sema-entity="room-study"
        data-sema-type="building:space"
        data-sema-space-kind="room"
        data-sema-purpose="study"
        data-sema-name="Study"
        data-sema-state="proposed"
        data-sema-certainty="estimated"
        data-sema-source="synthetic-design"
        x="120" y="80" width="240" height="100" rx="12" fill="#e5f1ef" stroke="#245c53" stroke-width="2">
    <title>Study overview card</title>
    <desc>Use the physical plan for room dimensions. Resizing this card changes presentation only.</desc>
  </rect>
  <text id="label-study-card"
        data-sema-type="core:label"
        data-sema-for="room-study"
        x="240" y="122" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#173d37">Study</text>
  <text x="240" y="152" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#245c53">Card size is presentation</text>
</svg>
